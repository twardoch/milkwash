# this_file: docs/_config.yml
title: milkwash
description: >-
  Does a rephrase pass with a language model remove a statistical watermark from
  a text? milkwash builds the equipment to find the answer.
url: https://code.twardoch.com
baseurl: /milkwash

# The theme is loaded from GitHub when the site is built. The repository holds no
# copy of the theme.
remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

color_scheme: dark
search_enabled: true
heading_anchors: true

aux_links:
  GitHub: https://github.com/twardoch/milkwash
  PyPI (milkwashy): https://pypi.org/project/milkwashy/
  crates.io (milkwashr): https://crates.io/crates/milkwashr
aux_links_new_tab: true

footer_content: >-
  milkwash is free software under the Apache-2.0 licence.

# The WebAssembly module and its loader are static files. Jekyll must copy them
# without a change.
include:
  - assets/wasm
keep_files:
  - assets/wasm

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
