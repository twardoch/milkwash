# this_file: milkwashy/pyproject.toml
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "milkwashy"
version = "1.0.0"
description = "Text-laundering pipeline: segment, rephrase per-chunk across many local LLMs, study watermark survival"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Linguistic",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["llm", "paraphrase", "watermark", "lmstudio", "openai", "sweep"]
dependencies = [
  "fire>=0.6",
  "rich>=13",
  "loguru>=0.7",
  "openai>=1.40",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "platformdirs>=4.2",
  "sentencex>=0.6",
  "pathvalidate>=3.2",
  "python-slugify>=8.0",
  "tomli-w>=1.0",
  "milkwashr==1.0.0",
]

[[project.authors]]
name = "Adam Twardoch"
email = "adam+github@twardoch.com"

[project.urls]
Homepage = "https://github.com/twardoch/milkwash"
Repository = "https://github.com/twardoch/milkwash.git"
Issues = "https://github.com/twardoch/milkwash/issues"
Changelog = "https://github.com/twardoch/milkwash/blob/main/CHANGELOG.md"

[project.scripts]
milkwashy = "milkwashy.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/milkwashy"]

# Local development only. Release builds run `uv build --no-sources`, so the
# published metadata keeps the plain `milkwashr==<version>` requirement.
[tool.uv.sources]
milkwashr = { path = "../milkwashr", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
